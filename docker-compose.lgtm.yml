services:
  grafana:
    image: grafana/grafana:11.6.2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - observability

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - observability

  mimir:
    image: grafana/mimir:2.15.0
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/mimir.yml"]
    ports:
      - "9009:9009"
    volumes:
      - ./docker/observability/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data:/data
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.8.2
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./docker/observability/alloy.river:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - observability

volumes:
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
  mimir_data: {}

networks:
  observability:
    driver: bridge
