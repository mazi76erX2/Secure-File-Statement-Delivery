name: Deploy Azure Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"
  push:
    branches: [main, master]

concurrency:
  group: deploy-azure-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: secure-statement-api
  TF_INPUT: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          AZURE_POSTGRES_SERVER_NAME: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
          AZURE_LOG_ANALYTICS_WORKSPACE_NAME: ${{ secrets.AZURE_LOG_ANALYTICS_WORKSPACE_NAME }}
          AZURE_CONTAINER_APP_ENV_NAME: ${{ secrets.AZURE_CONTAINER_APP_ENV_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          STATEMENT_API_KEY: ${{ secrets.STATEMENT_API_KEY }}
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
          AZURE_REDIS_PASSWORD: ${{ secrets.AZURE_REDIS_PASSWORD }}
        run: |
          set -eu
          missing=0
          for name in \
            AZURE_CREDENTIALS \
            AZURE_RESOURCE_GROUP_NAME \
            AZURE_LOCATION \
            AZURE_STORAGE_ACCOUNT_NAME \
            AZURE_ACR_NAME \
            AZURE_KEY_VAULT_NAME \
            AZURE_POSTGRES_SERVER_NAME \
            AZURE_LOG_ANALYTICS_WORKSPACE_NAME \
            AZURE_CONTAINER_APP_ENV_NAME \
            AZURE_CONTAINER_APP_NAME \
            STATEMENT_API_KEY \
            AZURE_DB_PASSWORD \
            AZURE_REDIS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize Azure credentials payload
        id: azure_creds
        env:
          RAW_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          raw_credentials = os.getenv("RAW_AZURE_CREDENTIALS", "").strip()
          fallback_subscription_id = os.getenv("AZURE_SUBSCRIPTION_ID", "").strip()

          if not raw_credentials:
              print("::error::Missing AZURE_CREDENTIALS secret.")
              print(
                  "::error::Set AZURE_CREDENTIALS using `az ad sp create-for-rbac --sdk-auth`."
              )
              sys.exit(1)

          try:
              credentials = json.loads(raw_credentials)
          except json.JSONDecodeError:
              print("::error::AZURE_CREDENTIALS must be valid JSON.")
              sys.exit(1)

          client_id = credentials.get("clientId") or credentials.get("appId") or ""
          client_secret = (
              credentials.get("clientSecret") or credentials.get("password") or ""
          )
          tenant_id = credentials.get("tenantId") or credentials.get("tenant") or ""
          subscription_id = (
              credentials.get("subscriptionId") or fallback_subscription_id or ""
          )

          missing_fields: list[str] = []
          if not client_id:
              missing_fields.append("clientId (or appId)")
          if not client_secret:
              missing_fields.append("clientSecret (or password)")
          if not tenant_id:
              missing_fields.append("tenantId (or tenant)")
          if not subscription_id:
              missing_fields.append(
                  "subscriptionId (or AZURE_SUBSCRIPTION_ID secret)"
              )

          if missing_fields:
              print(
                  "::error::AZURE_CREDENTIALS is missing required fields: "
                  + ", ".join(missing_fields)
              )
              print(
                  "::error::Use `az ad sp create-for-rbac --sdk-auth` or set AZURE_SUBSCRIPTION_ID."
              )
              sys.exit(1)

          normalized_credentials = {
              "clientId": client_id,
              "clientSecret": client_secret,
              "tenantId": tenant_id,
              "subscriptionId": subscription_id,
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("normalized<<EOF\n")
              output.write(json.dumps(normalized_credentials))
              output.write("\nEOF\n")
          PY

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ steps.azure_creds.outputs.normalized }}

      - name: Configure Terraform backend credentials
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ steps.azure_creds.outputs.normalized }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['clientId'])")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo '${{ steps.azure_creds.outputs.normalized }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['clientSecret'])")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo '${{ steps.azure_creds.outputs.normalized }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['tenantId'])")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ steps.azure_creds.outputs.normalized }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['subscriptionId'])")" >> "$GITHUB_ENV"

      - name: Register Azure resource providers
        run: |
          set -euo pipefail
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.Storage --wait
          az provider register --namespace Microsoft.KeyVault --wait
          az provider register --namespace Microsoft.DBforPostgreSQL --wait

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.5"

      - name: Bootstrap ACR
        working-directory: infra/terraform/azure
        env:
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_environment: prod
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_storage_account_name: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          TF_VAR_container_name: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
          TF_VAR_acr_name: ${{ secrets.AZURE_ACR_NAME }}
          TF_VAR_key_vault_name: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          TF_VAR_postgres_server_name: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
          TF_VAR_redis_container_app_name: ${{ secrets.AZURE_REDIS_CONTAINER_APP_NAME || 'ca-redis' }}
          TF_VAR_log_analytics_workspace_name: ${{ secrets.AZURE_LOG_ANALYTICS_WORKSPACE_NAME }}
          TF_VAR_container_app_environment_name: ${{ secrets.AZURE_CONTAINER_APP_ENV_NAME }}
          TF_VAR_container_app_name: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          TF_VAR_app_image: "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/secure-statement-api:bootstrap"
          TF_VAR_statement_api_key: ${{ secrets.STATEMENT_API_KEY }}
          TF_VAR_db_password: ${{ secrets.AZURE_DB_PASSWORD }}
          TF_VAR_redis_password: ${{ secrets.AZURE_REDIS_PASSWORD }}
          TF_VAR_pdf_password_kdf_iterations: ${{ vars.PDF_PASSWORD_KDF_ITERATIONS || 600000 }}
          TF_VAR_log_level: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          tofu init -input=false

          tofu apply -input=false -lock-timeout=10m -auto-approve \
            -target=azurerm_resource_group.statements \
            -target=azurerm_container_registry.main

      - name: Resolve ACR login server
        id: acr
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name "${{ secrets.AZURE_ACR_NAME }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP_NAME }}" --query loginServer -o tsv)"
          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_SHA::12}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"
          docker build -f docker/Dockerfile.prod -t "$ACR_LOGIN_SERVER/${IMAGE_NAME}:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/${IMAGE_NAME}:$IMAGE_TAG"
          echo "IMAGE_URI=$ACR_LOGIN_SERVER/${IMAGE_NAME}:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy app revision with image
        working-directory: infra/terraform/azure
        env:
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_environment: prod
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_storage_account_name: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          TF_VAR_container_name: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
          TF_VAR_acr_name: ${{ secrets.AZURE_ACR_NAME }}
          TF_VAR_key_vault_name: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          TF_VAR_postgres_server_name: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
          TF_VAR_redis_container_app_name: ${{ secrets.AZURE_REDIS_CONTAINER_APP_NAME || 'ca-redis' }}
          TF_VAR_log_analytics_workspace_name: ${{ secrets.AZURE_LOG_ANALYTICS_WORKSPACE_NAME }}
          TF_VAR_container_app_environment_name: ${{ secrets.AZURE_CONTAINER_APP_ENV_NAME }}
          TF_VAR_container_app_name: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          TF_VAR_app_image: ${{ env.IMAGE_URI }}
          TF_VAR_statement_api_key: ${{ secrets.STATEMENT_API_KEY }}
          TF_VAR_db_password: ${{ secrets.AZURE_DB_PASSWORD }}
          TF_VAR_redis_password: ${{ secrets.AZURE_REDIS_PASSWORD }}
          TF_VAR_pdf_password_kdf_iterations: ${{ vars.PDF_PASSWORD_KDF_ITERATIONS || 600000 }}
          TF_VAR_log_level: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          tofu init -input=false

          tofu apply -input=false -lock-timeout=10m -auto-approve

      - name: Print app URL
        working-directory: infra/terraform/azure
        run: |
          echo "Container App URL:"
          tofu output -raw container_app_url
